server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: file:///config-repo
      allow-override: true
      override-none: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/