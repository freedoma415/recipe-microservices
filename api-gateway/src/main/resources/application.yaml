server:
  port: 8080
spring:
  security:
    user:
      name: admin
      password: password
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3001" # Change this if your UI runs on a different port
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: recipe-service
          # 'RECIEPE' must exactly match the spring.application.name of your backend service
          uri: lb://RECIEPE
          predicates:
            - Path=/api/recipes/**

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

