server:
  port: 8082

spring:
  application:
    name: reciepe
  datasource:
    url: jdbc:mysql://recipe-mysql:3306/taskdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: user
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  security:
    user:
      name: admin
      password: password
  docker:
    compose:
      enabled: false

resilience4j:
  circuitbreaker:
    instances:
      recipeService:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

metrics:
  tags:
    application: reciepe

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
