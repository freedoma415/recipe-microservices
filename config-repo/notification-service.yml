server:
  port: 8083

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:mysql://localhost:3307/taskdb?createDatabaseIfNotExist=true
    username: user
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: eaf6420bef2ea0
    password: 6af9c27a27b660
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  # 1. Prevent Docker Compose startup crashes
  docker:
    compose:
      enabled: false

# 3. Expose Actuator for Prometheus scraping
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
metrics:
  tags:
    application: NotificationService

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/