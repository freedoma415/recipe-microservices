global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'eureka-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['eureka-server:8761']

  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    basic_auth:
      username: 'admin'
      password: 'password'
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: 'recipe-service'
    metrics_path: '/actuator/prometheus'
    basic_auth:
      username: 'admin'
      password: 'password'
    static_configs:
      - targets: ['recipe-service:8082']

  - job_name: 'notification-service'
    metrics_path: '/actuator/prometheus'
    basic_auth:
      username: 'admin'
      password: 'password'
    static_configs:
      - targets: ['notification-service:8083']

  - job_name: 'config-server'
    metrics_path: '/actuator/prometheus'
    basic_auth:
      username: 'admin'
      password: 'password'
    static_configs:
      - targets: ['config-server:8888']

  - job_name: 'review-service'
    metrics_path: '/actuator/prometheus'
    basic_auth:
      username: 'admin'
      password: 'password'
    static_configs:
      - targets: ['review-service:8084']